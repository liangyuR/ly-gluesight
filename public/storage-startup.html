<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlueSight</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #0e1416; color: #dce7eb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; min-height: 100vh; }
    main { max-width: 880px; margin: auto; background: #171e21; border: 1px solid #34464e; border-radius: 20px; padding: 28px; }
    .brand { color: #80d0df; margin: 0 0 24px; font-size: 15px; letter-spacing: .04em; }
    h1 { font-size: 24px; line-height: 1.4; margin: 0 0 16px; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; margin: 0; }
    #progress { color: #80d0df; margin-top: 20px; }
    #failure { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid #b8515a; background: #42272b; padding: 14px; border-radius: 10px; margin-top: 20px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    button { font: inherit; font-weight: 600; background: #334951; color: #dce7eb; border: 1px solid transparent; border-radius: 24px; padding: 11px 24px; cursor: pointer; }
    button.primary { background: #80d0df; color: #073543; }
    button:hover { filter: brightness(1.1); }
    button:focus-visible { outline: 3px solid #e2faff; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .55; }
    [hidden] { display: none !important; }
    #projects { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
    .project { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid #34464e; border-radius: 12px; cursor: pointer; }
    .project:has(input:checked) { border-color: #80d0df; background: #1d2a2e; }
    .project.unusable { cursor: not-allowed; opacity: .6; }
    .project small { color: #a9bdc7; display: block; }
    .create { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .create input { font: inherit; flex: 1 1 220px; background: #0e1416; color: #dce7eb; border: 1px solid #34464e; border-radius: 10px; padding: 10px 12px; }
    .create input:focus-visible { outline: 3px solid #e2faff; outline-offset: 2px; }
    .hint { color: #a9bdc7; font-size: 14px; line-height: 1.6; margin-top: 24px; }
    @media (max-width: 600px) { body { padding: 16px; } main { padding: 20px; } }

    body.splash-mode { padding: 0; overflow: hidden; user-select: none; cursor: default; }
    #splash { position: fixed; inset: 0; background: radial-gradient(120% 90% at 30% 35%, rgba(56, 189, 248, .08), transparent 60%), #0e1416; }
    #splash .art { position: absolute; left: 6%; top: 10%; width: 46%; }
    #splash svg { width: 100%; display: block; overflow: visible; }
    .corridor, .corridor-cut, .bead { fill: none; }
    .corridor { stroke: #80d0df; stroke-width: 178; opacity: .55; }
    .corridor-cut { stroke: #0e1416; stroke-width: 166; }
    .bead { stroke: #38bdf8; stroke-width: 70; stroke-linecap: round; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.1s cubic-bezier(.55, .1, .35, 1) forwards; }
    .edges .draw { animation-delay: .25s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .nozzle { offset-path: path("M180 700 C250 530 300 500 380 500 C470 500 540 548 630 548 C730 548 790 450 840 280"); offset-rotate: 0deg; animation: travel 1.1s cubic-bezier(.55, .1, .35, 1) forwards; }
    .nozzle circle { fill: #22c55e; }
    @keyframes travel { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    .scan rect { animation: sweep 1.8s cubic-bezier(.45, 0, .55, 1) .25s infinite; transform: translateX(-160px); }
    @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(860px); } }
    #splash .info { position: absolute; left: 56%; right: 7%; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    #splash .name { font-size: 30px; font-weight: 650; letter-spacing: .01em; margin: 0 0 18px; }
    #stage { font-size: 14px; min-height: 1.4em; margin: 0; }
    #steps { display: flex; gap: 6px; margin-top: 8px; }
    #steps i { flex: 1; height: 3px; border-radius: 2px; background: #22323a; position: relative; overflow: hidden; }
    #steps i::after { content: ""; position: absolute; inset: 0; background: #38bdf8; transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
    #steps i.done::after { transform: scaleX(1); }
    #steps i.now::after { transform: scaleX(.45); animation: pulse 1.1s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
    #version { position: absolute; left: 6%; bottom: 14px; color: #8fa5af; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { .draw, .nozzle { animation-duration: .01s; animation-delay: 0s; } .scan rect { animation: none; } }
  </style>
</head>
<body class="splash-mode">
  <div id="splash" role="status" aria-live="polite">
    <div class="art" aria-hidden="true">
      <svg viewBox="120 220 790 540">
        <defs>
          <path id="bead" d="M180 700 C250 530 300 500 380 500 C470 500 540 548 630 548 C730 548 790 450 840 280" pathLength="1000"/>
          <linearGradient id="sheen" x1="0" x2="1">
            <stop offset="0" stop-color="#80d0df" stop-opacity="0"/>
            <stop offset=".5" stop-color="#e2faff" stop-opacity=".8"/>
            <stop offset="1" stop-color="#80d0df" stop-opacity="0"/>
          </linearGradient>
          <mask id="band"><rect width="1024" height="1024" fill="#000"/><use href="#bead" stroke="#fff" stroke-width="178" fill="none"/></mask>
        </defs>
        <g class="edges">
          <use href="#bead" class="corridor draw"/>
          <use href="#bead" class="corridor-cut draw"/>
        </g>
        <use href="#bead" class="bead draw"/>
        <g class="scan" mask="url(#band)"><rect y="200" width="150" height="600" fill="url(#sheen)"/></g>
        <g class="nozzle"><circle r="78"/></g>
      </svg>
    </div>
    <div class="info">
      <p class="name">GlueSight</p>
      <p id="stage">正在启动…</p>
      <div id="steps"></div>
    </div>
    <span id="version"></span>
  </div>
  <main aria-labelledby="title" hidden>
    <p class="brand">GlueSight · 胶路智检</p>
    <section aria-live="polite" aria-atomic="true">
      <h1 id="title">正在初始化资料目录</h1>
      <p id="message">正在读取存储状态，请稍候。</p>
    </section>
    <p id="progress" role="status">正在初始化资料…</p>
    <div id="failure" role="alert" hidden></div>
    <div id="chooser" hidden>
      <div id="projects" role="radiogroup" aria-label="本机项目"></div>
      <div class="actions"><button id="open" type="button" class="primary" disabled>打开所选项目</button></div>
      <div class="create">
        <input id="newName" type="text" maxlength="64" placeholder="新项目名称" aria-label="新项目名称">
        <button id="create" type="button">新建空项目并打开</button>
      </div>
    </div>
    <div class="actions">
      <button id="close" type="button" hidden>关闭</button>
      <button id="retry" type="button" hidden>重试读取状态</button>
    </div>
    <p class="hint">资料目录准备完成后，将进入软件。</p>
  </main>
  <script>
    (() => {
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const progress = document.getElementById("progress");
      const failure = document.getElementById("failure");
      const close = document.getElementById("close");
      const retry = document.getElementById("retry");
      let state = null;
      let polling = false;
      let answering = false;
      let answeredId = null;
      let connected = false;
      let listed = null;
      const chooser = document.getElementById("chooser");
      const projects = document.getElementById("projects");
      const open = document.getElementById("open");
      const create = document.getElementById("create");
      const newName = document.getElementById("newName");
      const main = document.querySelector("main");
      const splash = document.getElementById("splash");
      const stage = document.getElementById("stage");
      const steps = document.getElementById("steps");
      const version = document.getElementById("version");

      function invoke(command, args) {
        if (!window.__TAURI_INTERNALS__ || typeof window.__TAURI_INTERNALS__.invoke !== "function") {
          return Promise.reject(new Error("未连接桌面后端。请从 GlueSight 桌面程序启动。"));
        }
        return window.__TAURI_INTERNALS__.invoke(command, args);
      }
      function errorText(error) {
        if (error instanceof Error) return error.message;
        if (typeof error === "string") return error;
        try { return JSON.stringify(error); } catch { return String(error); }
      }
      function render() {
        const kind = state && state.kind;
        const waiting = answering || (state && answeredId === state.requestId);
        const splashMode = (!kind || kind === "working") && failure.hidden;
        document.body.classList.toggle("splash-mode", splashMode);
        splash.hidden = !splashMode;
        main.hidden = splashMode;
        if (state) {
          stage.textContent = state.stage + "…";
          version.textContent = state.version ? "v" + state.version : "";
          if (steps.children.length !== state.steps) steps.replaceChildren(...Array.from({ length: state.steps }, () => document.createElement("i")));
          [...steps.children].forEach((bar, i) => { bar.className = i < state.step ? "done" : i === state.step ? "now" : ""; });
        }
        title.textContent = state ? state.title : "正在初始化资料目录";
        message.textContent = state ? state.message : "正在读取存储状态，请稍候。";
        progress.hidden = !!kind && kind !== "working" && !waiting;
        progress.textContent = waiting ? "正在处理，请稍候…" : "正在初始化资料…";
        close.hidden = kind !== "error";
        close.disabled = !!waiting || !connected;
        chooser.hidden = kind !== "chooseProject";
        if (kind === "chooseProject" && listed !== state.requestId) { listed = state.requestId; void loadProjects(); }
        open.disabled = answering || !projects.querySelector("input:checked");
        create.disabled = answering || !newName.value.trim();
      }
      async function loadProjects() {
        try {
          const list = await invoke("storage_startup_projects");
          projects.replaceChildren(...list.map(entry => {
            const label = document.createElement("label");
            label.className = entry.meta ? "project" : "project unusable";
            const radio = document.createElement("input");
            radio.type = "radio"; radio.name = "project"; radio.value = entry.id; radio.disabled = !entry.meta;
            radio.addEventListener("change", render);
            const text = document.createElement("span");
            text.textContent = entry.meta ? entry.meta.name : entry.id;
            const detail = document.createElement("small");
            detail.textContent = entry.meta ? entry.id : "不可用：" + entry.error;
            text.append(detail);
            label.append(radio, text);
            return label;
          }));
        } catch (error) {
          failure.textContent = "读取项目列表失败：" + errorText(error);
          failure.dataset.source = "answer";
          failure.hidden = false;
        }
        render();
      }
      async function choose(command, args) {
        if (answering) return;
        answering = true;
        failure.hidden = true;
        render();
        try {
          await invoke(command, args);
          progress.textContent = "正在重启…";
        } catch (error) {
          failure.textContent = "操作失败：" + errorText(error);
          failure.dataset.source = "answer";
          failure.hidden = false;
        } finally { answering = false; render(); }
      }
      async function poll() {
        if (polling) return;
        polling = true;
        try {
          const next = await invoke("storage_startup_status");
          if (!next || !Number.isSafeInteger(next.requestId) || typeof next.title !== "string" || typeof next.message !== "string" || typeof next.stage !== "string" || !Number.isSafeInteger(next.step) || !Number.isSafeInteger(next.steps) || !["working", "error", "chooseProject"].includes(next.kind)) {
            throw new Error("启动状态格式无效，请重试或重新启动软件。");
          }
          state = next;
          connected = true;
          if (failure.dataset.source === "poll") { failure.hidden = true; failure.textContent = ""; }
          retry.hidden = true;
          render();
        } catch (error) {
          connected = false;
          failure.textContent = "读取初始化状态失败：" + errorText(error);
          failure.dataset.source = "poll";
          failure.hidden = false;
          retry.hidden = false;
          render();
        } finally { polling = false; }
      }
      async function closeApp() {
        if (!state || !connected || answering || answeredId === state.requestId || state.kind !== "error") return;
        const requestId = state.requestId;
        answering = true;
        failure.hidden = true;
        render();
        try {
          await invoke("storage_startup_answer", { requestId });
          answeredId = requestId;
        } catch (error) {
          failure.textContent = "提交操作失败：" + errorText(error);
          failure.dataset.source = "answer";
          failure.hidden = false;
        } finally { answering = false; render(); void poll(); }
      }
      close.addEventListener("click", () => void closeApp());
      retry.addEventListener("click", () => void poll());
      open.addEventListener("click", () => {
        const picked = projects.querySelector("input:checked");
        if (picked) void choose("storage_startup_open_project", { id: picked.value });
      });
      create.addEventListener("click", () => void choose("storage_startup_create_project", { name: newName.value.trim() }));
      newName.addEventListener("input", render);
      void poll();
      const timer = window.setInterval(() => void poll(), 500);
      window.addEventListener("pagehide", () => window.clearInterval(timer), { once: true });
    })();
  </script>
</body>
</html>
