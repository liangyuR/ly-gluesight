<!doctype html>
<html lang="zh-CN">
<head>

</head>
<body class="v2 v3">

    <header class="main-header"><h1>配方</h1><a class="site-badge" href="#">真机</a></header>
    <div class="main-body">
      <div class="wp-page">

          <span class="qs-badge neutral"><span class="dot"></span>候选 编辑中 · 未发布</span>
        </div>
        <nav class="wp-steps" aria-label="配方配置步骤">
          <a class="wp-step-home" href="#"><span class="wp-step-no"><i data-icon="layout-dashboard" data-size="13"></i></span>总览</a>
          <a href="#"><span class="wp-step-no">1</span>整圈采集<span class="wp-step-status done"><i data-icon="check" data-size="12"></i>完成</span></a>
          <a class="optional" href="#"><span class="wp-step-no">2</span>默认参数<span class="wp-step-status done"><i data-icon="check" data-size="12"></i>完成</span></a>
          <a class="active" href="#"><span class="wp-step-no">3</span>单帧示教<span class="wp-step-status inProgress">4 / 12 组</span><span class="wp-step-progress qs-progress" style="--v:33%"><i></i></span></a>
          <a class="optional" href="#"><span class="wp-step-no">4</span>工件总览<span class="wp-step-status waiting">未开始</span></a>
          <a href="#"><span class="wp-step-no">5</span>验证与发布<span class="wp-step-status waiting">未开始</span></a>
        </nav>
        <div class="wp-teach">
          <section class="wp-group-panel" aria-label="拍照组"><h2>拍照组 <small>12</small></h2><nav class="wp-group-list" aria-label="拍照组选择">
<button class="wp-group-item"><i class="dot ok"></i><strong>S001</strong><span>已示教</span></button>
<button class="wp-group-item"><i class="dot ok"></i><strong>S002</strong><span>已示教</span></button>
<button class="wp-group-item"><i class="dot ok"></i><strong>S003</strong><span>已示教</span></button>
<button class="wp-group-item"><i class="dot ok"></i><strong>S004</strong><span>已示教</span></button>
<button class="wp-group-item"><i class="dot warn"></i><strong>S005</strong><span>待试测</span></button>
<button class="wp-group-item"><i class="dot warn"></i><strong>S006</strong><span>未配置</span></button>
<button class="wp-group-item selected" aria-pressed="true"><i class="dot off"></i><strong>S007</strong><span>待选图</span></button>
<button class="wp-group-item"><i class="dot off"></i><strong>S008</strong><span>待选图</span></button>
<button class="wp-group-item"><i class="dot off"></i><strong>S009</strong><span>待选图</span></button>
<button class="wp-group-item"><i class="dot off"></i><strong>S010</strong><span>待选图</span></button>
<button class="wp-group-item"><i class="dot off"></i><strong>S011</strong><span>待选图</span></button>
<button class="wp-group-item"><i class="dot off"></i><strong>S012</strong><span>待选图</span></button>
          </nav></section>
          <div class="wp-stack wp-mid">
            <section class="wp-picker" aria-label="本组检测图选择">
              <h2>S007<small>检测图</small></h2>
              <div class="wp-group-images" role="group" aria-label="本组图像"><button class="wp-view-option"><span class="wp-view-thumbnail" data-bead="1"></span><span class="wp-view-caption"><strong>cam1<span class="view-no"> · 图 1</span></strong><span class="small">选用此图</span></span></button><button class="wp-view-option"><span class="wp-view-thumbnail" data-bead="2"></span><span class="wp-view-caption"><strong>cam2<span class="view-no"> · 图 1</span></strong><span class="small">选用此图</span></span></button><button class="wp-view-option"><span class="wp-view-thumbnail" data-bead="3"></span><span class="wp-view-caption"><strong>cam3<span class="view-no"> · 图 1</span></strong><span class="small">选用此图</span></span></button></div>
              <div class="wp-picker-side"><button class="qs-icon-btn sm" aria-label="图像采集信息" aria-expanded="false"><i data-icon="info" data-size="15"></i></button><a class="wp-text-link" href="#">重新采集</a></div>
            </section><div class="qs-alert info-plain" role="status"><i data-icon="info" data-size="16"></i><span><strong>选择本组检测图</strong><span class="muted">点上方一张图作为 S007 的检测图开始示教，每组只需完成这一张；其余图仅采集、不检测。</span></span></div>

          <div class="wp-dock-actions">
            <button class="qs-btn  with-leading" disabled><i data-icon="save" data-size="15"></i>保存本组示教</button>
            <button class="qs-btn" disabled>保存并进入下一组<i data-icon="arrow-right" data-size="15"></i></button>
