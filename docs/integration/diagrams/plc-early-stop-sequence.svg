<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1945" viewBox="0 0 1200 1945" role="img" aria-labelledby="early-title early-desc">
<title id="early-title">已布防提前终止：有效 ERR 与握手故障的两种路径</title>
<desc id="early-desc">已布防提前终止的两种路径。PLC停止新脉冲后刷新末计数，与PC提交有效ERR结果可并行、先后不定，PC无需等待PLC刷新计数才置done。PLC末计数已刷新和有效结果已校验锁存两项条件在ACK前汇合；visionFault或没有有效done时保留pending，不强制ACK，实物处置后显式复位。</desc>
<defs>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0 0 L9 4.5 L0 9Z" fill="#245b96"/>
</marker>
<marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0 0 L9 4.5 L0 9Z" fill="#13806d"/>
</marker>
</defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#21364a}.title{font-size:27px;font-weight:700}.subtitle{font-size:16px;fill:#5c7083}.actor{font-size:20px;font-weight:700}.actor-sub{font-size:15px;fill:#526b7e}.body{font-size:17px}.small{font-size:15px;fill:#526b7e}.step{font-size:18px;font-weight:650;fill:#245b96}.number{font-size:16px;font-weight:700;fill:#fff}.note-title{font-size:17px;font-weight:700;fill:#996328}.warn{font-size:16px;fill:#8a5b22}.good{font-size:17px;fill:#107260}.panel-title{font-size:22px;font-weight:700}</style>
<rect width="1200" height="1945" fill="#fff"/>
<rect x="1" y="1" width="1198" height="1943" rx="16" fill="#fff" stroke="#dbe5ee"/>
<rect x="1" y="1" width="1198" height="8" rx="4" fill="#245b96"/>
<text x="32" y="49" class="title" text-anchor="start">已布防提前终止：有效 ERR 与握手故障的两种路径</text>
<text x="32" y="79" class="subtitle" text-anchor="start">先停新触发；有效结果才 ACK；异常结论不代表质量合格</text>
<rect x="24" y="110" width="1152" height="1090" rx="14" fill="#fff" stroke="#cfdeea"/>
<text x="48" y="146" class="panel-title" text-anchor="start">A · 握手仍可报告：提前终止形成有效 ERR 结果</text>
<text x="48" y="173" class="small" text-anchor="start">前提：本件已布防；无需等待 partEnd；本路径不形成有效质量判定。</text>
<rect x="153" y="194" width="235" height="52" rx="12" fill="#edf4fb" stroke="#dbe5ee"/>
<text x="270" y="227" class="actor" text-anchor="middle">PLC / 机器人</text>
<rect x="793" y="194" width="235" height="52" rx="12" fill="#edf8f5" stroke="#dbe5ee"/>
<text x="910" y="227" class="actor" text-anchor="middle">视觉 PC</text>
<path d="M270 246V1135 M910 246V1135" stroke="#b6c8d6" stroke-width="2" stroke-dasharray="6 7"/>
<circle cx="43" cy="266" r="16" fill="#245b96"/>
<text x="43" y="272" class="number" text-anchor="middle">A1</text>
<text x="74" y="272" class="step" text-anchor="start">PC 提前终止并撤销布防</text>
<rect x="360" y="284" width="520" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="301" class="body" text-anchor="start">visionReady=0；armed=0；busy 保持 1</text>
<path d="M 910 330 H 270" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="370" y="358" class="small" text-anchor="start">PLC 立即停止新脉冲，并限时等待有效结果。</text>
<rect x="65" y="375" width="1080" height="258" rx="10" fill="none" stroke="#13806d" stroke-dasharray="7 5"/>
<circle cx="43" cy="388" r="16" fill="#245b96"/>
<text x="43" y="394" class="number" text-anchor="middle">A2</text>
<text x="74" y="394" class="step" text-anchor="start">PLC 停稳触发并刷新实际末计数（接入要求；与 A3 可并行）</text>
<rect x="360" y="399" width="650" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="416" class="body" text-anchor="start">计入最后已发脉冲 → 刷新 camera1/2/3Triggers</text>
<text x="370" y="441" class="body" text-anchor="start">计数必须在 ACK 前写完；禁止继续发新脉冲</text>
<path d="M 270 457 h 44 v 22 h -44" fill="none" stroke="#245b96" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="370" y="484" class="small" text-anchor="start">PC 在 ACK 时读取这些计数，供后续帧归属使用。</text>
<circle cx="43" cy="516" r="16" fill="#245b96"/>
<text x="43" y="522" class="number" text-anchor="middle">A3</text>
<text x="74" y="522" class="step" text-anchor="start">PC 写完异常结果后提交 done（与 A2 先后不定）</text>
<rect x="360" y="529" width="730" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="546" class="body" text-anchor="start">resultCode=90；faultCode=91–100；写本件 resultSeq / resultSn</text>
<text x="370" y="571" class="body" text-anchor="start">→ done=1（最后）；busy=1、armed=0、visionFault=0</text>
<path d="M 910 595 H 270" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="370" y="620" class="good" text-anchor="start">A2 与 A3 可并行、先后不定；PC 提交 done 无需等待 PLC 刷新末计数。</text>
<circle cx="43" cy="651" r="16" fill="#245b96"/>
<text x="43" y="657" class="number" text-anchor="middle">A4</text>
<text x="74" y="657" class="step" text-anchor="start">PLC 校验完整状态、身份与结果组合后锁存</text>
<rect x="360" y="664" width="730" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="681" class="body" text-anchor="start">done=1，armed=0，busy=1，visionReady=0；无协议故障</text>
<text x="370" y="706" class="body" text-anchor="start">resultSeq=requestSeq；resultSn=partSn；90 / 91–100</text>
<path d="M 270 725 h 44 v 22 h -44" fill="none" stroke="#245b96" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="370" y="754" class="warn" text-anchor="start">提前 OK / NG、未知组合或身份不匹配：禁止确认和放行。</text>
<circle cx="43" cy="786" r="16" fill="#245b96"/>
<text x="43" y="792" class="number" text-anchor="middle">A5</text>
<text x="74" y="792" class="step" text-anchor="start">条件汇合：末计数已刷新且结果有效，才允许 ACK</text>
<rect x="360" y="801" width="650" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="818" class="body" text-anchor="start">末计数已刷新且有效结果已锁存 → ackSeq=resultSeq → resultAck=1</text>
<path d="M 270 850 H 910" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="370" y="878" class="small" text-anchor="start">A2 计数刷新与 A3 有效结果经 A4 校验，均须在 A5 ACK 前完成；ACK 不代表良品。</text>
<circle cx="43" cy="901" r="16" fill="#245b96"/>
<text x="43" y="907" class="number" text-anchor="middle">A6</text>
<text x="74" y="907" class="step" text-anchor="start">按正常次序释放事务</text>
<rect x="360" y="914" width="600" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="931" class="body" text-anchor="start">PC：done=0 → busy=0</text>
<path d="M 910 965 H 270" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<rect x="360" y="993" width="600" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="1010" class="body" text-anchor="start">PLC：partStart / partEnd / resultAck=0</text>
<path d="M 270 1044 H 910" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<rect x="360" y="1072" width="600" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="1089" class="body" text-anchor="start">PC：确认释放、追溯落盘 → visionReady=1</text>
<path d="M 910 1123 H 270" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<rect x="48" y="1143" width="1104" height="40" rx="8" fill="#fff5e6" stroke="#ead0a3"/>
<text x="66" y="1169" class="warn" text-anchor="start">当前参考 FB 未补齐提前停止后的末计数刷新；未补齐时须隔离并复位对齐，不能承诺连续下一件计数正确。</text>
<rect x="24" y="1224" width="1152" height="660" rx="14" fill="#fff" stroke="#cfdeea"/>
<text x="48" y="1260" class="panel-title" text-anchor="start">B · 握手故障：visionFault 或没有可用的有效 done</text>
<text x="48" y="1287" class="small" text-anchor="start">例如心跳失活、请求身份变化或回写失败；残留结果不能用于 ACK。</text>
<rect x="153" y="1308" width="235" height="52" rx="12" fill="#edf4fb" stroke="#dbe5ee"/>
<text x="270" y="1341" class="actor" text-anchor="middle">PLC / 机器人</text>
<rect x="793" y="1308" width="235" height="52" rx="12" fill="#edf8f5" stroke="#dbe5ee"/>
<text x="910" y="1341" class="actor" text-anchor="middle">视觉 PC</text>
<path d="M270 1360V1825 M910 1360V1825" stroke="#b6c8d6" stroke-width="2" stroke-dasharray="6 7"/>
<circle cx="43" cy="1384" r="16" fill="#245b96"/>
<text x="43" y="1390" class="number" text-anchor="middle">B1</text>
<text x="74" y="1390" class="step" text-anchor="start">PC 进入握手故障，可能没有可提交的 done</text>
<rect x="360" y="1397" width="690" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="1414" class="body" text-anchor="start">visionReady=0；armed=0；visionFault=1</text>
<text x="370" y="1439" class="body" text-anchor="start">通信中断时 PLC 也必须按心跳失活停止新触发</text>
<path d="M 910 1460 H 270" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<circle cx="43" cy="1519" r="16" fill="#245b96"/>
<text x="43" y="1525" class="number" text-anchor="middle">B2</text>
<text x="74" y="1525" class="step" text-anchor="start">PLC 停止新脉冲并锁入故障</text>
<rect x="360" y="1534" width="690" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="1551" class="body" text-anchor="start">保留双方 pending、请求身份与现场信号</text>
<text x="370" y="1576" class="body" text-anchor="start">没有有效 done / 身份不匹配 → 不强制 ACK</text>
<path d="M 270 1595 h 44 v 22 h -44" fill="none" stroke="#245b96" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="370" y="1630" class="warn" text-anchor="start">不得使用残留 resultCode / resultSeq 假装完成该件。</text>
<circle cx="43" cy="1674" r="16" fill="#245b96"/>
<text x="43" y="1680" class="number" text-anchor="middle">B3</text>
<text x="74" y="1680" class="step" text-anchor="start">实物处置后，进入显式复位流程</text>
<rect x="360" y="1687" width="690" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="370" y="1704" class="body" text-anchor="start">核对实物、SN、requestSeq、pending 与已锁存结果</text>
<text x="370" y="1729" class="body" text-anchor="start">人工确认隔离、复检或已有有效结果 → 显式复位</text>
<path d="M 270 1750 H 910" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="370" y="1782" class="small" text-anchor="start">完成新低→高复位及就绪核验后，才允许下一件。</text>
<text x="48" y="1855" class="small" text-anchor="start">本图的 A / B 是不同处理路径：检测 ERR 可有效确认；握手故障保留事务并按人工处置与复位规则执行。</text>
<text x="32" y="1918" class="small" text-anchor="start">协议修订 1.1 · 线上版本 1 · A2 / A3 可并行、先后不定，其余按纵向步骤阅读；比例非真实时间。</text>
</svg>
