<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580" role="img" aria-labelledby="reset-title reset-desc">
<title id="reset-title">启动 / 重连：实物处置后的显式复位</title>
<desc id="reset-desc">操作员先核对并处置实物及未结事务，人工ReconcileConfirmed并对本地ResetRequest发新边沿。PLC释放输入，faultReset低至少一秒后高至少五百毫秒；PC验证心跳、设备、审计和稳定基线，完成记录后ready。PLC看到ready低到高并核验版本及四个输出均为零才放行。</desc>
<defs>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0 0 L9 4.5 L0 9Z" fill="#245b96"/>
</marker>
<marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0 0 L9 4.5 L0 9Z" fill="#13806d"/>
</marker>
</defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#21364a}.title{font-size:27px;font-weight:700}.subtitle{font-size:16px;fill:#5c7083}.actor{font-size:20px;font-weight:700}.actor-sub{font-size:15px;fill:#526b7e}.body{font-size:17px}.small{font-size:15px;fill:#526b7e}.step{font-size:18px;font-weight:650;fill:#245b96}.number{font-size:16px;font-weight:700;fill:#fff}.note-title{font-size:17px;font-weight:700;fill:#996328}.warn{font-size:16px;fill:#8a5b22}.good{font-size:17px;fill:#107260}.panel-title{font-size:22px;font-weight:700}</style>
<rect width="1200" height="1580" fill="#fff"/>
<rect x="1" y="1" width="1198" height="1578" rx="16" fill="#fff" stroke="#dbe5ee"/>
<rect x="1" y="1" width="1198" height="8" rx="4" fill="#245b96"/>
<text x="32" y="49" class="title" text-anchor="start">启动 / 重连：实物处置后的显式复位</text>
<text x="32" y="79" class="subtitle" text-anchor="start">先处置未结件，再建立中性基线与新复位边沿；连接成功不等于可以接件</text>
<rect x="71" y="110" width="218" height="72" rx="12" fill="#edf4fb" stroke="#dbe5ee"/>
<text x="180" y="140" class="actor" text-anchor="middle">操作员</text>
<text x="180" y="166" class="actor-sub" text-anchor="middle">实物核对与人工处置</text>
<path d="M 180 182 V 1382" stroke="#b6c8d6" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="491" y="110" width="218" height="72" rx="12" fill="#edf4fb" stroke="#dbe5ee"/>
<text x="600" y="140" class="actor" text-anchor="middle">PLC / 参考 FB</text>
<text x="600" y="166" class="actor-sub" text-anchor="middle">本地复位控制、输出互锁</text>
<path d="M 600 182 V 1382" stroke="#b6c8d6" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="911" y="110" width="218" height="72" rx="12" fill="#edf8f5" stroke="#dbe5ee"/>
<text x="1020" y="140" class="actor" text-anchor="middle">视觉 PC</text>
<text x="1020" y="166" class="actor-sub" text-anchor="middle">新会话、审计与就绪核验</text>
<path d="M 1020 182 V 1382" stroke="#b6c8d6" stroke-width="2" stroke-dasharray="6 7"/>
<circle cx="43" cy="203" r="16" fill="#245b96"/>
<text x="43" y="209" class="number" text-anchor="middle">1</text>
<text x="74" y="209" class="step" text-anchor="start">启动 / 重连 / 配置变化：进入复位要求</text>
<rect x="640" y="214" width="470" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="650" y="231" class="body" text-anchor="start">PC 保留 pending，要求显式复位</text>
<text x="650" y="256" class="body" text-anchor="start">残留 visionReady 高不能证明新会话就绪</text>
<path d="M 1020 277 h -44 v 22 h 44" fill="none" stroke="#245b96" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="240" y="315" class="small" text-anchor="start">PLC 首次调用或 Startup 进入复位态；全程停止新触发，等待双方心跳变化。</text>
<circle cx="43" cy="348" r="16" fill="#245b96"/>
<text x="43" y="354" class="number" text-anchor="middle">2</text>
<text x="74" y="354" class="step" text-anchor="start">操作员先完成实物与未结事务处置</text>
<rect x="220" y="359" width="850" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="230" y="376" class="body" text-anchor="start">核对实物、运动、双方 pending、SN、requestSeq 与已锁存结果</text>
<text x="230" y="401" class="body" text-anchor="start">决定隔离 / 复检 / 已有有效结果，并确认处置完成</text>
<path d="M 180 422 H 600" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="240" y="450" class="warn" text-anchor="start">运行中的未结件不能直接清输入强切下一件。</text>
<circle cx="43" cy="473" r="16" fill="#245b96"/>
<text x="43" y="479" class="number" text-anchor="middle">3</text>
<text x="74" y="479" class="step" text-anchor="start">人工确认后，给本地 FB 新复位请求</text>
<rect x="220" y="484" width="900" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="230" y="501" class="body" text-anchor="start">允许 ReconcileConfirmed；ResetRequest 先低，再发新上升沿</text>
<text x="230" y="526" class="body" text-anchor="start">两者均为参考 FB 本地输入，不是新增 DB 点位；确认不可永久接 TRUE</text>
<path d="M 180 547 H 600" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<circle cx="43" cy="598" r="16" fill="#245b96"/>
<text x="43" y="604" class="number" text-anchor="middle">4</text>
<text x="74" y="604" class="step" text-anchor="start">PLC 建立中性输入，并保持复位低电平</text>
<rect x="640" y="609" width="490" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="650" y="626" class="body" text-anchor="start">partStart=partEnd=resultAck=0</text>
<text x="650" y="651" class="body" text-anchor="start">faultReset=0 持续至少 1 s</text>
<path d="M 600 672 H 1020" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="240" y="703" class="small" text-anchor="start">复位期间保持 requestSeq、ackSeq 及连接会话基线稳定；PLC 须确认 PC 心跳活跃。</text>
<circle cx="43" cy="733" r="16" fill="#245b96"/>
<text x="43" y="739" class="number" text-anchor="middle">5</text>
<text x="74" y="739" class="step" text-anchor="start">PLC 产生 PC 可观察的新 faultReset 上升沿</text>
<rect x="640" y="749" width="490" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="650" y="766" class="body" text-anchor="start">faultReset=1，保持至少 500 ms</text>
<path d="M 600 797 H 1020" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<circle cx="43" cy="853" r="16" fill="#245b96"/>
<text x="43" y="859" class="number" text-anchor="middle">6</text>
<text x="74" y="859" class="step" text-anchor="start">PC 核验复位条件，再清本侧输出</text>
<rect x="640" y="864" width="510" height="75" rx="3" fill="#fff" stroke="none"/>
<text x="650" y="881" class="body" text-anchor="start">设备就绪、PLC 心跳有变化、审计可用</text>
<text x="650" y="906" class="body" text-anchor="start">输入中性且基线稳定；清 armed / done / busy / visionFault</text>
<text x="650" y="931" class="body" text-anchor="start">pcProtocolVersion=1；visionReady 仍为 0</text>
<path d="M 1020 947 h -44 v 22 h 44" fill="none" stroke="#245b96" stroke-width="2.2" marker-end="url(#blue)"/>
<circle cx="43" cy="1028" r="16" fill="#245b96"/>
<text x="43" y="1034" class="number" text-anchor="middle">7</text>
<text x="74" y="1034" class="step" text-anchor="start">PC 完成复位审计与持久化，再提交 ready</text>
<rect x="640" y="1039" width="510" height="75" rx="3" fill="#fff" stroke="none"/>
<text x="650" y="1056" class="body" text-anchor="start">记录原事务与复位审计，结束原 pending</text>
<text x="650" y="1081" class="body" text-anchor="start">再次核验中性输入、连接与序号基线稳定</text>
<text x="650" y="1106" class="body" text-anchor="start">最后置 visionReady=1</text>
<path d="M 1020 1132 H 600" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<circle cx="43" cy="1193" r="16" fill="#245b96"/>
<text x="43" y="1199" class="number" text-anchor="middle">8</text>
<text x="74" y="1199" class="step" text-anchor="start">PLC 观察 ready 从低到高，完成放行核验</text>
<rect x="640" y="1204" width="510" height="75" rx="3" fill="#fff" stroke="none"/>
<text x="650" y="1221" class="body" text-anchor="start">必须已见 visionReady=0，然后观察到 1</text>
<text x="650" y="1246" class="body" text-anchor="start">pcProtocolVersion=1；armed=busy=done=visionFault=0</text>
<text x="650" y="1271" class="body" text-anchor="start">PC 心跳活跃，faultReset 高保持已满 500 ms</text>
<path d="M 600 1290 h 44 v 22 h -44" fill="none" stroke="#245b96" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="240" y="1339" class="good" text-anchor="start">PLC 清 faultReset，结束本地 pending，复位成功后才允许接收下一件。</text>
<rect x="30" y="1380" width="1140" height="133" rx="12" fill="#fff5e6" stroke="#ead0a3"/>
<text x="50" y="1411" class="note-title" text-anchor="start">复位超时、条件未满足或 ready 未形成低→高：仍禁止生产</text>
<text x="50" y="1442" class="body" text-anchor="start">重新核对实物与未结事务处置，再发新的低→高复位请求；不要重复使用旧高电平。</text>
<text x="50" y="1473" class="body" text-anchor="start">计数错位不得自动修改基线猜测归属；复位过程与真实触发、设备会话的重新对齐仍须现场验收。</text>
<text x="32" y="1551" class="small" text-anchor="start">协议修订 1.1 · 线上版本 1 · 事件纵向有序，比例非真实时间 · 普通空闲恢复不能代替启动或重连后的显式复位。</text>
</svg>
