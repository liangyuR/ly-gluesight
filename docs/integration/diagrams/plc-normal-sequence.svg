<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1670" viewBox="0 0 1200 1670" role="img" aria-labelledby="normal-title normal-desc">
<title id="normal-title">正常生产一件：接件 → 硬触发 → 结果 → 双方释放</title>
<desc id="normal-desc">生产用途下的一件事务时序。PLC直接硬触发一个三目设备，PC异步接收复合帧；各提交标志最后写入，结果校验、锁存和ACK后双方释放，追溯落盘后再ready。</desc>
<defs>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0 0 L9 4.5 L0 9Z" fill="#245b96"/>
</marker>
<marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0 0 L9 4.5 L0 9Z" fill="#13806d"/>
</marker>
</defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#21364a}.title{font-size:27px;font-weight:700}.subtitle{font-size:16px;fill:#5c7083}.actor{font-size:20px;font-weight:700}.actor-sub{font-size:15px;fill:#526b7e}.body{font-size:17px}.small{font-size:15px;fill:#526b7e}.step{font-size:18px;font-weight:650;fill:#245b96}.number{font-size:16px;font-weight:700;fill:#fff}.note-title{font-size:17px;font-weight:700;fill:#996328}.warn{font-size:16px;fill:#8a5b22}.good{font-size:17px;fill:#107260}.panel-title{font-size:22px;font-weight:700}</style>
<rect width="1200" height="1670" fill="#fff"/>
<rect x="1" y="1" width="1198" height="1668" rx="16" fill="#fff" stroke="#dbe5ee"/>
<rect x="1" y="1" width="1198" height="8" rx="4" fill="#245b96"/>
<text x="32" y="49" class="title" text-anchor="start">正常生产一件：接件 → 硬触发 → 结果 → 双方释放</text>
<text x="32" y="79" class="subtitle" text-anchor="start">协议修订 1.1 · 线上版本 1 · 一件一个在途事务 · S7 共享 DB 握手</text>
<rect x="71" y="110" width="218" height="72" rx="12" fill="#edf4fb" stroke="#dbe5ee"/>
<text x="180" y="140" class="actor" text-anchor="middle">PLC / 机器人</text>
<text x="180" y="166" class="actor-sub" text-anchor="middle">运动、触发与结果锁存</text>
<path d="M 180 182 V 1435" stroke="#b6c8d6" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="491" y="110" width="218" height="72" rx="12" fill="#edf4fb" stroke="#dbe5ee"/>
<text x="600" y="140" class="actor" text-anchor="middle">三目设备</text>
<text x="600" y="166" class="actor-sub" text-anchor="middle">一个 Device · 帧内三个视角</text>
<path d="M 600 182 V 1435" stroke="#b6c8d6" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="911" y="110" width="218" height="72" rx="12" fill="#edf8f5" stroke="#dbe5ee"/>
<text x="1020" y="140" class="actor" text-anchor="middle">视觉 PC</text>
<text x="1020" y="166" class="actor-sub" text-anchor="middle">S7 握手、异步检测与追溯</text>
<path d="M 1020 182 V 1435" stroke="#b6c8d6" stroke-width="2" stroke-dasharray="6 7"/>
<circle cx="43" cy="203" r="16" fill="#245b96"/>
<text x="43" y="209" class="number" text-anchor="middle">1</text>
<text x="74" y="209" class="step" text-anchor="start">等待就绪：外部用途已锁定为生产</text>
<rect x="260" y="214" width="740" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="270" y="231" class="body" text-anchor="start">visionReady=1；armed=busy=done=visionFault=0；版本均为 1</text>
<path d="M 1020 267 H 180" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="260" y="295" class="small" text-anchor="start">PLC 保持 partStart / partEnd / resultAck=0；双方心跳持续变化。</text>
<circle cx="43" cy="318" r="16" fill="#245b96"/>
<text x="43" y="324" class="number" text-anchor="middle">2</text>
<text x="74" y="324" class="step" text-anchor="start">提交并冻结本件请求</text>
<rect x="260" y="329" width="740" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="270" y="346" class="body" text-anchor="start">先写 requestSeq、SN、产品、计划、零触发数及 ackSeq=0</text>
<text x="270" y="371" class="body" text-anchor="start">payload 写完后，最后置 partStart=1</text>
<path d="M 180 392 H 1020" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="260" y="420" class="small" text-anchor="start">请求 payload 冻结至双方释放且 PC 再次 ready；一个时刻仅一件在途。</text>
<circle cx="43" cy="443" r="16" fill="#245b96"/>
<text x="43" y="449" class="number" text-anchor="middle">3</text>
<text x="74" y="449" class="step" text-anchor="start">PC 稳定读取、核对请求并完成设备布防</text>
<rect x="260" y="454" width="740" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="270" y="471" class="body" text-anchor="start">visionReady=0 → acceptedSeq=requestSeq、acceptedPlanReserved=0</text>
<text x="270" y="496" class="body" text-anchor="start">→ busy=1 → armed=1（最后提交）</text>
<path d="M 1020 517 H 180" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="260" y="545" class="small" text-anchor="start">PLC 核对完整发脉冲条件后才启动连续运动与触发；等待布防时禁止触发。</text>
<circle cx="43" cy="568" r="16" fill="#245b96"/>
<text x="43" y="574" class="number" text-anchor="middle">4</text>
<text x="74" y="574" class="step" text-anchor="start">连续点胶飞拍：硬触发与收图相互独立</text>
<rect x="225" y="594" width="405" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="235" y="611" class="body" text-anchor="start">按计划位置直接输出硬触发脉冲</text>
<path d="M 180 640 H 600" fill="none" stroke="#13806d" stroke-width="2.5" marker-end="url(#green)"/>
<text x="240" y="665" class="small" text-anchor="start">PLC 用可靠输出计数源更新各槽触发数。</text>
<rect x="630" y="686" width="350" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="640" y="703" class="body" text-anchor="start">设备帧（包含三个视角）</text>
<path d="M 600 725 H 1020" fill="none" stroke="#13806d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#green)"/>
<text x="640" y="752" class="small" text-anchor="start">PC 按设备会话、计数及拍照点关联，异步检测。</text>
<circle cx="43" cy="798" r="16" fill="#245b96"/>
<text x="43" y="804" class="number" text-anchor="middle">5</text>
<text x="74" y="804" class="step" text-anchor="start">运动与全部计划触发结束</text>
<rect x="260" y="809" width="740" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="270" y="826" class="body" text-anchor="start">PLC 核对实际数等于计划数 → 写最终 camera1/2/3Triggers</text>
<text x="270" y="851" class="body" text-anchor="start">→ partEnd=1；partStart 仍保持 1</text>
<path d="M 180 872 H 1020" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="260" y="900" class="small" text-anchor="start">PC 校验结束与计数，等待本件收帧和测量完成。</text>
<circle cx="43" cy="923" r="16" fill="#245b96"/>
<text x="43" y="929" class="number" text-anchor="middle">6</text>
<text x="74" y="929" class="step" text-anchor="start">PC 发布整件结果</text>
<rect x="260" y="934" width="740" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="270" y="951" class="body" text-anchor="start">armed=0，busy 保持 1；先写 resultCode、faultCode、resultSn、resultSeq</text>
<text x="270" y="976" class="body" text-anchor="start">→ done=1（结果 payload 完成后最后提交）</text>
<path d="M 1020 997 H 180" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="260" y="1025" class="small" text-anchor="start">正常生产 OK / NG 必须在 PLC 完成最终计数核对并提交 partEnd 后出现。</text>
<circle cx="43" cy="1048" r="16" fill="#245b96"/>
<text x="43" y="1054" class="number" text-anchor="middle">7</text>
<text x="74" y="1054" class="step" text-anchor="start">PLC 校验并锁存有效结果</text>
<rect x="260" y="1059" width="740" height="50" rx="3" fill="#fff" stroke="none"/>
<text x="270" y="1076" class="body" text-anchor="start">核对状态、resultSeq=requestSeq、resultSn=partSn 与已知结果码组合</text>
<text x="270" y="1101" class="body" text-anchor="start">锁存结果 → ackSeq=resultSeq → resultAck=1</text>
<path d="M 180 1122 H 1020" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="260" y="1150" class="small" text-anchor="start">ACK 表示已接收结论，NG 与 ERR 也可有效确认；ACK 不代表良品。</text>
<circle cx="43" cy="1169" r="16" fill="#245b96"/>
<text x="43" y="1175" class="number" text-anchor="middle">8</text>
<text x="74" y="1175" class="step" text-anchor="start">PC 确认 ACK 后释放结果占用</text>
<rect x="260" y="1179" width="740" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="270" y="1196" class="body" text-anchor="start">核对匹配 ACK → 先清 done=0 → 再清 busy=0</text>
<path d="M 1020 1227 H 180" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<circle cx="43" cy="1268" r="16" fill="#245b96"/>
<text x="43" y="1274" class="number" text-anchor="middle">9</text>
<text x="74" y="1274" class="step" text-anchor="start">PLC 看到 done=busy=0 后释放请求</text>
<rect x="260" y="1284" width="740" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="270" y="1301" class="body" text-anchor="start">partStart=0、partEnd=0、resultAck=0</text>
<path d="M 180 1332 H 1020" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<circle cx="43" cy="1373" r="16" fill="#245b96"/>
<text x="43" y="1379" class="number" text-anchor="middle">10</text>
<text x="74" y="1379" class="step" text-anchor="start">PC 确认 PLC 释放，并完成追溯落盘</text>
<rect x="260" y="1389" width="740" height="25" rx="3" fill="#fff" stroke="none"/>
<text x="270" y="1406" class="body" text-anchor="start">最后置 visionReady=1；此时才允许下一件更新请求</text>
<path d="M 1020 1437 H 180" fill="none" stroke="#245b96" stroke-width="2.5" marker-end="url(#blue)"/>
<rect x="30" y="1475" width="1140" height="138" rx="12" fill="#f1f8fc" stroke="#cfe0ed"/>
<text x="50" y="1504" class="step" text-anchor="start">触发放行必须逐项成立（本图描述协议要求）</text>
<text x="50" y="1532" class="body" text-anchor="start">armed=busy=1；done=partEnd=visionReady=visionFault=0；acceptedSeq=requestSeq；双方心跳活跃。</text>
<text x="50" y="1559" class="body" text-anchor="start">planReserved=acceptedPlanReserved=0，并满足现场用途与设备互锁；任一失效立即禁止新脉冲。</text>
<text x="50" y="1586" class="warn" text-anchor="start">当前参考 FB 尚缺部分 ready / done / 保留字段检查；须补齐并做异常注入、真实 CPU / I/O / SDK 联调。</text>
<text x="32" y="1643" class="small" text-anchor="start">箭头表示事件先后；纵向比例不代表真实时间。硬触发不经过 PC 的 S7 轮询；采集用途的 1/0 只表示采集完成。</text>
</svg>
