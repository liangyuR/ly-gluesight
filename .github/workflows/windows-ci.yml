name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_cache:
        description: Restore and save dependency caches
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: windows-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      required: ${{ steps.plan.outputs.required }}
      rust-format: ${{ steps.plan.outputs.rust-format }}
      base: ${{ steps.plan.outputs.base }}
      node: ${{ steps.plan.outputs.node }}
      pnpm: ${{ steps.plan.outputs.pnpm }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select validation from changed paths
        id: plan
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/Plan-Ci.mjs

  frontend:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.shard == 1 && '0' || '1' }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ needs.changes.outputs.pnpm }}
          standalone: true
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.changes.outputs.node }}
          cache: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_cache) && 'pnpm' || '' }}
          package-manager-cache: false
      - name: Prepare Rust formatter
        if: matrix.shard == 1 && needs.changes.outputs.rust-format == 'true'
        run: rustup toolchain install ${{ needs.changes.outputs.rust }} --profile minimal --component rustfmt
      - name: Format check
        if: matrix.shard == 1
        env:
          FORMAT_BASE: ${{ needs.changes.outputs.base }}
        run: |
          git diff --check $env:FORMAT_BASE $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Changed files contain whitespace errors.' }
          node scripts/Check-RustFormat.mjs --base $env:FORMAT_BASE --head $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Incremental Rust format check failed.' }
      - name: CI routing regression
        if: matrix.shard == 1
        run: node --test scripts/Plan-Ci.test.mjs
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend unit tests
        run: pnpm test --shard=${{ matrix.shard }}/2
      - uses: actions/setup-python@v6
        if: matrix.shard == 1
        with:
          python-version: '3.12'
      - name: Production simulation input tests
        if: matrix.shard == 1
        run: |
          python -m pip install -r tools/production-simulator/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Simulation input dependencies failed to install.' }
          python tests/native/prepare-production-simulation_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Simulation input tests failed.' }
          python -m pip install zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { throw 'Compressed raw reader dependency failed to install.' }
          python tests/native/gsr-raw_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Compressed raw reader tests failed.' }

  rust:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/cargo-ci
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare Rust tools
        run: |
          rustup toolchain install ${{ needs.changes.outputs.rust }} --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        with:
          workspaces: src-tauri -> target/cargo-ci
          shared-key: windows-ci-${{ needs.changes.outputs.rust }}
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Production simulator tests
        run: cargo test --locked --manifest-path tools/production-simulator/Cargo.toml
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked --lib --config 'profile.dev.package.gluesight.opt-level=0'

  verify:
    needs: [changes, frontend, rust]
    if: always()
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Require all selected validations
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          if ($env:PLAN_RESULT -ne 'success') { throw 'CI path selection failed.' }
          $expected = switch ($env:REQUIRED) {
            'true' { 'success' }
            'false' { 'skipped' }
            default { throw 'Missing or invalid CI path selection.' }
          }
          if ($env:FRONTEND_RESULT -ne $expected -or $env:RUST_RESULT -ne $expected) {
            throw "Required validations did not complete: frontend=$env:FRONTEND_RESULT rust=$env:RUST_RESULT"
          }
