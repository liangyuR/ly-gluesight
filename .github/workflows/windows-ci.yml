name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_cache:
        description: Restore and save dependency caches
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/cargo-ci
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read tool versions
        id: tools
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          "node=$($package.engines.node -replace '^>=', '')" >> $env:GITHUB_OUTPUT
          "pnpm=$($package.packageManager -replace '^pnpm@', '')" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tools.outputs.pnpm }}
          standalone: true
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_cache) && 'pnpm' || '' }}
          package-manager-cache: false
      - name: Prepare Rust tools
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Format check
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:FORMAT_BASE
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') { $base = "$env:GITHUB_SHA^" }
          git diff --check $base $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Changed files contain whitespace errors.' }
          $edition = [regex]::Match((Get-Content -LiteralPath src-tauri/Cargo.toml -Raw), '(?m)^edition\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $edition) { throw 'Missing Rust edition in Cargo.toml.' }
          $files = @(git -c core.quotepath=false diff --name-only --diff-filter=ACMR $base $env:GITHUB_SHA -- '*.rs')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to list changed Rust files.' }
          if ($files.Count -eq 0) { Write-Host 'No changed Rust files; rustfmt skipped.' }
          foreach ($file in $files) {
            rustfmt --check --edition $edition --config skip_children=true -- $file
            if ($LASTEXITCODE -ne 0) { throw "Rust format check failed: $file" }
          }
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        with:
          workspaces: src-tauri -> target/cargo-ci
          shared-key: windows-ci-1.99.1
          cache-workspace-crates: false
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend unit tests
        run: pnpm test
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked --lib
