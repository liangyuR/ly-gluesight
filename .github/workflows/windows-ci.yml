name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_cache:
        description: Restore and save dependency caches
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.plan.outputs.required }}
      rust-format: ${{ steps.plan.outputs.rust-format }}
      base: ${{ steps.plan.outputs.base }}
      node: ${{ steps.plan.outputs.node }}
      pnpm: ${{ steps.plan.outputs.pnpm }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select validation from changed paths
        id: plan
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/Plan-Ci.mjs

  frontend:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ needs.changes.outputs.pnpm }}
          standalone: true
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.changes.outputs.node }}
          cache: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_cache) && 'pnpm' || '' }}
          package-manager-cache: false
      - name: Prepare Rust formatter
        if: needs.changes.outputs.rust-format == 'true'
        run: rustup toolchain install ${{ needs.changes.outputs.rust }} --profile minimal --component rustfmt
      - name: Format check
        env:
          FORMAT_BASE: ${{ needs.changes.outputs.base }}
        run: |
          git diff --check "$FORMAT_BASE" "$GITHUB_SHA"
          node scripts/Check-RustFormat.mjs --base "$FORMAT_BASE" --head "$GITHUB_SHA"
      - name: CI routing regression
        run: node --test scripts/Plan-Ci.test.mjs
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend unit tests
        run: pnpm test

  rust:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/cargo-ci
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare Rust tools
        run: |
          rustup toolchain install ${{ needs.changes.outputs.rust }} --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        with:
          workspaces: src-tauri -> target/cargo-ci
          shared-key: windows-ci-${{ needs.changes.outputs.rust }}
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked --lib --config 'profile.dev.package.gluesight.opt-level=0'

  verify:
    needs: [changes, frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected validations
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [[ "$REQUIRED" == true ]]; then
            test "$FRONTEND_RESULT" = success
            test "$RUST_RESULT" = success
          else
            test "$REQUIRED" = false
            test "$FRONTEND_RESULT" = skipped
            test "$RUST_RESULT" = skipped
          fi
