name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_cache:
        description: Restore and save dependency caches
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/cargo-ci
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read tool versions
        id: tools
        run: pwsh -NoProfile -File scripts/Test-PackageVersions.ps1
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tools.outputs.pnpm }}
          standalone: true
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_cache) && 'pnpm' || '' }}
          package-manager-cache: false
      - name: Prepare package and Rust tools
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        with:
          workspaces: src-tauri -> target/cargo-ci
          shared-key: windows-ci-1.99.1
          cache-workspace-crates: false
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test
      - name: Sample set converter tests
        run: pnpm samples:test
      - name: Desktop production smoke
        run: |
          $runtime = & pwsh -NoProfile -File scripts/Restore-LyFlowRuntime.ps1
          if ($LASTEXITCODE -ne 0) { throw 'lyFlow runtime restore failed.' }
          pnpm test:ui:production -Suite burst -LyFlowRuntime (@($runtime)[-1]) -ResetData
      - name: Packaging script tests
        run: |
          ./tests/packaging/Test-RuntimeBundle.ps1
          ./tests/packaging/Test-LyFlowDependency.ps1
          ./tests/packaging/Test-VendorDependency.ps1
      - name: Packaging workflow gate tests
        run: node --test tests/packaging/windows-workflow.test.mjs
      - name: Soak script decision tests
        run: node --test tests/native/throughput-gate.test.mjs tests/native/soak-faults-assess.test.mjs tests/native/desktop-infrastructure.test.mjs
      - name: Rust library regression
        working-directory: src-tauri
        run: cargo test --locked --lib
      - name: Upload desktop reports and startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-production-reports
          if-no-files-found: warn
          path: |
            output/playwright/flow-regression/runner/html/
            output/playwright/flow-regression/runner/junit.xml
            output/playwright/flow-regression/build.log
            output/playwright/flow-regression/stdout.log
            output/playwright/flow-regression/stderr.log
      - name: Upload desktop failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-production-failures
          if-no-files-found: ignore
          path: |
            output/playwright/flow-regression/runner/test-results/**/*.png
            output/playwright/flow-regression/runner/test-results/**/*trace*.zip
