name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read tool versions
        id: tools
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($package.packageManager -notmatch '^pnpm@(\d+\.\d+\.\d+)$') { throw 'packageManager must pin pnpm.' }
          "pnpm=$($Matches[1])" >> $env:GITHUB_OUTPUT
          if ($package.engines.node -notmatch '^>=(\d+\.\d+\.\d+)$') { throw 'engines.node must declare a minimum Node version.' }
          "node=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - name: Prepare package and Rust tools
        env:
          PNPM_VERSION: ${{ steps.tools.outputs.pnpm }}
        run: |
          npm install --global "pnpm@$env:PNPM_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed.' }
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test
      - name: Production frontend build
        run: pnpm build
      - name: Packaging script tests
        run: pwsh -NoProfile -File tests/packaging/Test-RuntimeBundle.ps1
      - name: Packaging workflow gate tests
        run: node --test tests/packaging/windows-workflow.test.mjs
      - name: Rust library regression
        working-directory: src-tauri
        run: cargo test --locked --lib
