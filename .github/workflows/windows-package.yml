name: Windows package

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/*.ps1'
      - 'packaging/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'rust-toolchain.toml'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tauri*.json'
      - 'src-tauri/build.rs'
      - 'src-tauri/icons/**'
      - 'tests/packaging/**'
  workflow_dispatch:
    inputs:
      use_cache:
        description: Restore and save dependency caches
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/cargo-release
      PACKAGE_TIMINGS: ${{ github.workspace }}/src-tauri/target/package-reports/stage-seconds.txt
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify versions and installer policy
        id: tools
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./scripts/Test-PackageVersions.ps1 -Tag $env:GITHUB_REF_NAME -VerifyMainAncestor
          } else { ./scripts/Test-PackageVersions.ps1 }
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tools.outputs.pnpm }}
          standalone: true
          run_install: false
      - uses: actions/setup-node@v6
        id: node-tools
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_cache) && 'pnpm' || '' }}
          package-manager-cache: false
      - name: Prepare package and Rust tools
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        with:
          workspaces: src-tauri -> target/cargo-release
          shared-key: windows-release-1.99.1
          cache-workspace-crates: false
      - name: Resolve lyFlow release
        id: lyflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/LyFlow-Dependency.ps1
          $config = Get-LyFlowDependencyConfig $env:GITHUB_WORKSPACE
          [void](Get-LyFlowCargoTag (Join-Path $env:GITHUB_WORKSPACE 'src-tauri/Cargo.toml') $config)
          $release = Select-LyFlowRelease (Get-LyFlowReleases $config.lyflow.repository) $config
          "version=$($release.version)" >> $env:GITHUB_OUTPUT
          "cache-key=lyflow-$($config.lyflow.repository.Replace('/', '-'))-$($release.version)-x64" >> $env:GITHUB_OUTPUT
          Write-Host "lyFlow $($config.lyflow.series) latest release: $($release.tag)"
      - name: Read dependency cache identities
        id: cache-identity
        run: |
          $config = Get-Content -LiteralPath packaging/runtime.json -Raw | ConvertFrom-Json
          foreach ($part in @($config.repository, $config.tag, $config.asset, $config.bundleVersion)) {
            if ([string]$part -notmatch '^[A-Za-z0-9._/-]+$') { throw 'Invalid dependency cache identity.' }
          }
          "vendor=vendor-$($config.repository.Replace('/', '-'))-$($config.tag)-$($config.asset)-$($config.bundleVersion)" >> $env:GITHUB_OUTPUT
          $pnpmLock = Get-Content -LiteralPath pnpm-lock.yaml -Raw
          if ($pnpmLock -notmatch "(?m)^      '@tauri-apps/cli':\r?\n        specifier: [^\r\n]+\r?\n        version: (\d+\.\d+\.\d+)\s*$") { throw 'Missing locked Tauri CLI version.' }
          $cli = $Matches[1]
          "nsis=nsis-windows-$cli" >> $env:GITHUB_OUTPUT
          "nsis-path=$(Join-Path $env:LOCALAPPDATA 'tauri/NSIS')" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: lyflow-cache
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        with:
          path: src-tauri/target/dependency-cache/lyflow
          key: ${{ steps.lyflow.outputs.cache-key }}
      - uses: actions/cache@v4
        id: vendor-cache
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        with:
          path: src-tauri/target/dependency-cache/vendor
          key: ${{ steps.cache-identity.outputs.vendor }}
      - uses: actions/cache@v4
        id: nsis-cache
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        with:
          path: ${{ steps.cache-identity.outputs.nsis-path }}
          key: ${{ steps.cache-identity.outputs.nsis }}
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Require a clean SDK environment
        run: |
          $mvsPaths = @('C:/Program Files (x86)/MVS', 'C:/Program Files/MVS', 'C:/Program Files (x86)/Common Files/MVS', 'C:/Program Files/Common Files/MVS')
          if (@($mvsPaths | Where-Object { Test-Path -LiteralPath $_ }).Count -gt 0) { throw 'Packaging verification requires a runner without system MVS.' }
      - name: Prepare bundled runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path (Split-Path -Parent $env:PACKAGE_TIMINGS) -Force | Out-Null
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try { ./scripts/Prepare-RuntimeDependencies.ps1 }
          finally { "runtime=$($timer.Elapsed.TotalSeconds.ToString('F3', [Globalization.CultureInfo]::InvariantCulture))" | Add-Content -LiteralPath $env:PACKAGE_TIMINGS }
      - name: Prepare installer resources
        run: pwsh -NoProfile -File scripts/Prepare-PackageResources.ps1
      - name: Production frontend build
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try {
            pnpm build
            if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
          } finally { "frontend=$($timer.Elapsed.TotalSeconds.ToString('F3', [Globalization.CultureInfo]::InvariantCulture))" | Add-Content -LiteralPath $env:PACKAGE_TIMINGS }
      - name: Production Rust build
        working-directory: src-tauri
        run: |
          $env:TAURI_CONFIG = Get-Content -LiteralPath target/package-runtime/tauri.runtime.json -Raw
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try {
            cargo build --locked --release --target x86_64-pc-windows-msvc --bin GlueSight --features tauri/custom-protocol
            if ($LASTEXITCODE -ne 0) { throw 'Rust build failed.' }
          } finally { "rust=$($timer.Elapsed.TotalSeconds.ToString('F3', [Globalization.CultureInfo]::InvariantCulture))" | Add-Content -LiteralPath $env:PACKAGE_TIMINGS }
      - name: Verify actual DLL vision and application runtime
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try {
            ./scripts/Test-PackageApplication.ps1 -ApplicationPath src-tauri/target/cargo-release/x86_64-pc-windows-msvc/release/GlueSight.exe
          } finally { "vision=$($timer.Elapsed.TotalSeconds.ToString('F3', [Globalization.CultureInfo]::InvariantCulture))" | Add-Content -LiteralPath $env:PACKAGE_TIMINGS }
      - name: Bundle NSIS installer
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try {
            pnpm exec tauri bundle --bundles nsis --target x86_64-pc-windows-msvc --config src-tauri/target/package-runtime/tauri.runtime.json
            if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed.' }
          } finally { "nsis=$($timer.Elapsed.TotalSeconds.ToString('F3', [Globalization.CultureInfo]::InvariantCulture))" | Add-Content -LiteralPath $env:PACKAGE_TIMINGS }
      - name: Record release inputs and timings
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
          CACHE_STATUS: '{"enabled":${{ github.event_name != ''workflow_dispatch'' || inputs.use_cache }},"pnpm":"${{ steps.node-tools.outputs.cache-hit }}","cargo":"${{ steps.rust-cache.outputs.cache-hit }}","lyflow":"${{ steps.lyflow-cache.outputs.cache-hit }}","vendor":"${{ steps.vendor-cache.outputs.cache-hit }}","nsis":"${{ steps.nsis-cache.outputs.cache-hit }}"}'
        run: ./scripts/Write-ReleaseManifest.ps1 -TimingPath $env:PACKAGE_TIMINGS -CacheStatusJson $env:CACHE_STATUS -Status $env:VALIDATION_STATUS
      - name: Upload installer and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: gluesight-windows-x64
          overwrite: true
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/cargo-release/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/package-runtime/runtime/manifest.json
            src-tauri/target/package-runtime/runtime-validation.json
            src-tauri/target/package-runtime/application-runtime-validation.json
            src-tauri/target/package-reports/*.json
            src-tauri/target/package-reports/*.txt
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gluesight-windows-failure-reports
          overwrite: true
          retention-days: 14
          if-no-files-found: ignore
          path: |
            src-tauri/target/package-runtime/runtime-validation.json
            src-tauri/target/package-runtime/application-runtime-validation.json
            src-tauri/target/package-reports/*.json
            src-tauri/target/package-reports/*.txt

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gluesight-windows-x64
          path: release-artifacts
      - name: Create a new draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid application release tag.' }
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'A release already exists for this tag; it will not be overwritten.' }
          $assets = @(Get-ChildItem -LiteralPath release-artifacts -File -Recurse | Where-Object { $_.Extension -in @('.exe', '.json') } | ForEach-Object FullName)
          if (@($assets | Where-Object { $_ -like '*-setup.exe' }).Count -ne 1) { throw 'Installer artifact is missing or ambiguous.' }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          Windows x64 安装包，携带 lyFlow 与 MVS 运行库。

          目标电脑需预装 WebView2 和匹配的 MVS 设备驱动；本次构建已完成软件运行库自检，真机收图与现场验收另行执行。
          "@ | Set-Content -LiteralPath $notes -Encoding utf8NoBOM
          gh release create $env:RELEASE_TAG @assets --repo $env:RELEASE_REPOSITORY --verify-tag --draft --title "GlueSight $env:RELEASE_TAG" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
