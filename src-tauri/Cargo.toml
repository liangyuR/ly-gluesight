[package]
name = "gluesight"
version = "0.1.1"
description = "GlueSight · 胶路智检"
edition = "2021"
default-run = "GlueSight"

[[bin]]
name = "GlueSight"
path = "src/main.rs"

[lib]
name = "gluesight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
base64 = "=0.22.1"
tauri = { version = "2", features = [] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
libloading = "0.8"
# 诊断包 ZIP：与 png 解码共用已锁定的版本
flate2 = "1"
crc32fast = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# tag 必须属于 packaging/runtime.json 的 lyflow.series；升级用 pnpm deps:lyflow:update。
lyflow-client = { git = "https://github.com/liangyuR/lyFlow.git", tag = "v1.1.1" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm", "bmp", "tiff"] }
ly-plc = { git = "https://github.com/liangyuR/ly-plc.git", rev = "d482e4b1f6c0568fdd2b26f782cb15a93572f9bd", version = "0.3.0" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# 模拟相机逐像素合成图像，未优化时一帧要一两秒，赶不上节拍
[profile.dev.package.gluesight]
opt-level = 2

# 回放相机解码 JPEG：未优化时一帧几百毫秒
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
