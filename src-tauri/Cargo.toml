[package]
name = "gluesight"
version = "0.1.3"
description = "GlueSight · 胶路智检"
edition = "2021"
default-run = "GlueSight"

[[bin]]
name = "GlueSight"
path = "src/main.rs"

[lib]
name = "gluesight_lib"
# 只出桌面端：staticlib/cdylib 是移动端用的，每次改动都要多链接一份含全部依赖的 .lib 和 .dll
crate-type = ["rlib"]

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
base64 = "=0.22.1"
tauri = { version = "2.12.5", features = [] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
libloading = "0.8"
# 诊断包 ZIP：与 png 解码共用已锁定的版本
flate2 = "1"
crc32fast = "1"
# 配方迁移包：读写需 ZIP64（多轮原图可超过 4 GB）与 SHA-256 清单校验
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# tag 必须属于 packaging/runtime.json 的 lyflow.series；升级用 pnpm deps:lyflow:update。
lyflow-client = { git = "https://github.com/liangyuR/lyFlow.git", tag = "v1.1.5" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm", "bmp", "tiff"] }
ly-plc = { git = "https://github.com/liangyuR/ly-plc.git", rev = "fe6c2105209ba87d6b4abfe58a1fe0dad290f6e0", version = "0.4.0" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# 只保留行号：panic 回溯可定位，.o/.pdb 小、链接快；要看局部变量时临时改回 debug = true
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 模拟相机逐像素合成图像，未优化时一帧要一两秒，赶不上节拍
[profile.dev.package.gluesight]
opt-level = 2

# 回放相机解码 JPEG：未优化时一帧几百毫秒
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
