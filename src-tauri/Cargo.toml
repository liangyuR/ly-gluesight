[package]
name = "gluesight"
version = "0.2.2"
description = "GlueSight · 胶路智检"
edition = "2021"
default-run = "GlueSight"

[[bin]]
name = "GlueSight"
path = "src/main.rs"

[lib]
name = "gluesight_lib"
# 只出桌面端：staticlib/cdylib 是移动端用的，每次改动都要多链接一份含全部依赖的 .lib 和 .dll
crate-type = ["rlib"]

[features]
default = []

[build-dependencies]
argon2 = "0.5"
base64 = "0.22"
url = "2"
uuid = "1"
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
base64 = "=0.23.1"
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net"] }
# 示教 MCP 服务（docs/integration/agent-teaching.md）：只监听本机的 HTTP JSON-RPC
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
libloading = "0.8"
# 诊断包 ZIP：与 png 解码共用已锁定的版本
flate2 = "1"
crc32fast = "1"
# 项目导出导入包：读写需 ZIP64（多轮原图可超过 4 GB）与 SHA-256 清单校验
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
grantmint-offline = { git = "https://github.com/liangyuR/grantmint.git", rev = "7183c40960853a32cb176be2ccb46c7aa75b50fc" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
argon2 = "0.5"
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
# 录制原图空闲压缩（docs/decisions/image-storage.md IS-2）
zstd = { version = "0.13", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# tag 必须属于 packaging/runtime.json 的 lyflow.series；升级用 pnpm deps:lyflow:update。
lyflow-client = { git = "https://github.com/liangyuR/lyFlow.git", tag = "v1.3.3" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm", "bmp", "tiff"] }
ly-plc = { git = "https://github.com/liangyuR/ly-plc.git", rev = "fe6c2105209ba87d6b4abfe58a1fe0dad290f6e0", version = "0.4.0" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }

# 只保留行号：panic 回溯可定位，.o/.pdb 小、链接快；要看局部变量时临时改回 debug = true
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 模拟相机逐像素合成图像，未优化时一帧要一两秒，赶不上节拍
[profile.dev.package.gluesight]
opt-level = 2

[profile.test.package.gluesight]
opt-level = 0

# 回放相机解码 JPEG：未优化时一帧几百毫秒
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
