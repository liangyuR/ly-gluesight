<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robot + PLC 联调台</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#101419;color:#e5ecf4;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1200px;margin:36px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:27px;margin:0}h2{font-size:17px;margin:0 0 14px}p{margin:5px 0;color:#9fabbd}.chip{padding:6px 12px;border-radius:20px;background:#1e334f;color:#81b7ff}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}.card{padding:22px;background:#191f27;border:1px solid #2e3744;border-radius:12px;margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{font:inherit;color:inherit;border:1px solid #455267;background:#252e3c;padding:9px 13px;border-radius:7px}button{cursor:pointer}button.primary{background:#2463c8;border-color:#387dea}button:disabled{opacity:.4;cursor:default}.signals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.signal{padding:8px 10px;background:#121820;border-radius:6px;font:13px/1.5 ui-monospace,monospace}.light{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4b5360;margin-right:9px}.on{background:#43d5a3}.value{float:right;color:#92bfff}.state{font-size:23px;margin:9px 0;color:#8abbff}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}td,th{padding:9px;border-bottom:1px solid #303846}th{color:#95a5ba;font-weight:500}.good{color:#44dda3}.bad{color:#ffab75}pre{max-height:220px;overflow:auto;white-space:pre-wrap;color:#a5b4c8;font:12px/1.6 ui-monospace,monospace}#error{color:#ffae9e;margin:10px 0}svg{display:block;width:100%;height:180px}small{color:#9eacbf}@media(max-width:800px){.grid{grid-template-columns:1fr}header{display:block}}
</style>
<main><header><div><h1>Robot + PLC 联调台</h1><p id="recipe-summary">正在读取模拟配置…</p></div><span class="chip">本机模拟环境</span></header>
<div class="grid"><section><div class="card"><h2>Robot 服务</h2><div class="row"><select id="scenario" aria-label="运行工况" disabled><option value="normal">正常件</option><option value="gap">段内断胶</option><option value="lostFrame">末帧丢失</option><option value="locateFail">胶路偏出搜索区</option><option value="countMismatch">拍照点数不符</option></select><button class="primary" id="one" disabled>运行一件</button><button id="continuous" disabled>连续运行</button><button id="stop" disabled>本件后停止</button><button id="reset" disabled>故障复位</button></div><p id="readiness" role="status" aria-live="polite">正在确认服务和握手状态，确认后可操作。</p><div id="error" role="alert"></div><div id="phase" class="state">连接中…</div><p id="message"></p><p id="detail"></p><svg viewBox="0 0 420 120" role="img" aria-label="拍照点顺序与设备触发计数"></svg><p id="shot-detail"></p><small>Robot 通过 Modbus TCP 等待布防、提交工件、确认结果；触发桥把拍照脉冲交给软件模拟相机。</small></div><div class="card"><h2>握手事件</h2><pre id="events"></pre></div></section>
<section><div class="card"><h2>PLC · <span id="endpoint">127.0.0.1:1502</span></h2><p id="connection"></p><div id="signals" class="signals"></div><p id="registers"></p><small id="unit">地址从 0 开始 · 32 位值按 ABCD 顺序</small></div><div class="card"><h2>PLC 接收到的结果</h2><table><thead><tr><th>工件 SN</th><th>工况</th><th>结果码</th><th>异常码</th></tr></thead><tbody id="results"></tbody></table><p><small>图像为合成灰度图，检测由实际 lyFlow 引擎完成；演示不代表现场精度验收。</small></p></div></section></div></main>
<script type="module" src="/console.mjs"></script></html>
